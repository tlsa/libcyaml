name: "Static Analysis"

on: [push]

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: apt-get install packages
      run: sudo apt-get update -qq &&
           sudo apt-get install --no-install-recommends -y
               libyaml-dev

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - run: |
       make

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  scan-build:
    name: scan-build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 1

    - name: apt-get install packages
      run: sudo apt-get update -qq &&
           sudo apt-get install --no-install-recommends -y
               libyaml-dev
               clang-tools

    - name: scan-build
      run: |
       make clean
       scan-build -sarif --keep-empty -o build/sarif make

    # Clang writes one SARIF run per translation unit but GitHub allows one run.
    - name: Merge SARIF files
      run: |
       find build/sarif -name '*.sarif' -print0 | xargs -0 jq -s '
         [.[].runs[]] as $runs
         | {
             "$schema": .[0]["$schema"],
             version: "2.1.0",
             runs: [($runs[0] | del(.artifacts)) + {
               tool: {driver: ($runs[0].tool.driver + {
                 rules: ([$runs[].tool.driver.rules[]?] | unique_by(.id))
               })},
               results: [$runs[].results[]? | del(.ruleIndex)
                 | walk(if type == "object" and has("uri")
                        then del(.index) else . end)]
             }]
           }' > build/scan-build.sarif
       jq -e '.runs | length == 1' build/scan-build.sarif

    - name: upload scan-build
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: build/scan-build.sarif
        category: scan-build
